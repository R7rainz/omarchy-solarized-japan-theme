# Solarized Japan for Omarchy
# Palette source: https://github.com/craftzdog/solarized-osaka.nvim
# Upstream snapshot: a21176efde15fab21fabda0bf2ba123ed6d7332d
# Exact Solarized Osaka tokens mapped to Omarchy semantic roles.

mode = "dark"

# Omarchy foundation
accent               = "#29a298" # cyan
foreground           = "#839395" # fg
cursor               = "#839395" # fg
background           = "#001419" # base04
border               = "#063540" # base02
comment              = "#637981" # base00
selection            = "#002c38" # base03
selection_foreground = "#839395" # fg
selection_background = "#002c38" # base03

# Omarchy surface and text roles
dark_background      = "#001419" # base04
