lighter_background   = "#002c38" # base03
muted                = "#637981" # base00
dark_foreground      = "#576d74" # base01
light_foreground     = "#9eabac" # base0
bright_foreground    = "#fdf5e2" # base3

# Solarized Osaka accents
red                  = "#db302d"
yellow               = "#b28500"
